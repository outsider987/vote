name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  # On election night scripts/publish-live.mjs pushes the poller's results to the live-data branch and
  # dispatches this workflow, so every deploy carries the newest results.json.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer queued run replaces an older queued one, so fresh results win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # code changes are gated on the checks; results-only deploys skip them to stay fast
      - if: github.event_name == 'push'
        run: npm run typecheck && npm test
      - run: npm run build
        env:
          # repository variable: "replay" (default) or "live" for election day
          VITE_SOURCE: ${{ vars.VITE_SOURCE || 'replay' }}
      - name: Add the latest live results
        run: |
          if git fetch --depth=1 origin live-data 2>/dev/null; then
            mkdir -p apps/web/dist/live
            for f in results.json candidates.json; do
              git show "FETCH_HEAD:$f" > "apps/web/dist/live/$f" 2>/dev/null || rm -f "apps/web/dist/live/$f"
            done
            ls -l apps/web/dist/live
          else
            echo "No live-data branch yet; deploying without live results."
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
