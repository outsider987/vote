name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: github.event_name == 'push'
        run: npm run typecheck && npm test
      - run: npm run build
        env:
          # repository variables. VITE_SOURCE is normally unset: the site is the 2026 edition (countdown, then
          # live at 16:00). Set it to "replay" to fall back to the 2022 replay. VITE_LIVE_URL points at vote-live.
          VITE_SOURCE: ${{ vars.VITE_SOURCE }}
          VITE_LIVE_URL: ${{ vars.VITE_LIVE_URL }}
      - name: Deploy the site to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; built but not deployed. See README (部署)."
            exit 0
          fi
          npx wrangler pages deploy apps/web/dist --project-name "${{ vars.PAGES_PROJECT || 'kaipiao' }}" --branch main --commit-hash "${GITHUB_SHA::7}"
