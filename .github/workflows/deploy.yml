name: Deploy Docker Compose Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Deploy to Server (Blue-Green)
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          
            cd ~/vote
            git pull

            # Determine the active environment.
            # Here we assume if a container named vote_blue exists, blue is active.
            if echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S docker ps --filter "name=vote_blue" --format "{{.Names}}" | grep -q vote_blue; then
              CURRENT="blue"
              NEW="green"
            else
              CURRENT="green"
              NEW="blue"
            fi

            echo "Current deployment: $CURRENT. Deploying new version as: $NEW"

            # Build and start the new environment using a distinct project name (e.g., vote_blue or vote_green)
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S docker-compose -p vote_$NEW up -d --build

            # (Optional) Insert health checks or wait time to ensure the new environment is fully operational
            sleep 10

         

            # Once confirmed healthy, take down the old deployment
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S docker-compose -p vote_$CURRENT down

            # Clean up unused images
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S docker image prune -af

          EOF
