function countyState(c,t){const m=c._curve,p=Math.max(0,Math.min(1,(Math.max(0,(t-m.start)/(m.end-m.start)))**m.power));if(p>=1)return {p:1,total:c.valid,votes:c.candidates.map(x=>x.votes),leader:c.candidates.findIndex(x=>x.elected)};const total=Math.round(c.valid*p),raw=c.candidates.map((x,i)=>{let n=m.noise[i];let share=x.votes/c.valid+(1-p)*(.075*Math.sin(t*n.f+n.a)+.032*Math.sin(t*n.g+n.b)+n.bias);if(c._close&&i===c._runner)share+=(1-p)*.085;if(c._close&&i===c._winner)share-=(1-p)*.085;return Math.max(.0001,share)}),sum=raw.reduce((a,b)=>a+b,0);const parts=raw.map(v=>v/sum*total),votes=parts.map(Math.floor);let remain=total-votes.reduce((a,b)=>a+b,0);const order=parts.map((v,i)=>i).sort((a,b)=>(parts[b]-votes[b])-(parts[a]-votes[a]));for(let i=0;i<remain;i++)votes[order[i]]++;return {p,total,votes,leader:votes.indexOf(Math.max(...votes))}}
function snapshot(t){const states=data.counties.map(c=>countyState(c,t));const total=states.reduce((s,x)=>s+x.total,0),valid=data.counties.reduce((s,c)=>s+c.valid,0);const seats=Object.fromEntries(partyOrder.map(p=>[p,0]));states.forEach((s,i)=>{if(s.p===1){const winner=data.counties[i].candidates.find(c=>c.elected);seats[winner.party]=(seats[winner.party]||0)+1}});return {states,seats,overall:total/valid*100,decided:Object.values(seats).reduce((a,b)=>a+b,0)}}
function project([lon,lat]){const merc=v=>Math.log(Math.tan(Math.PI/4+v*Math.PI/360));return [(lon-121)*23,(merc(lat)-merc(23.6))*1200]}
const insets={'09020':[-38,16,.47],'09007':[-38,36,.67],'10016':[-35,-7,.8]};
function countyShapes(f){const polygons=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;const points=polygons.flat(2).map(project);const box=new THREE.Box2().setFromPoints(points.map(p=>new THREE.Vector2(...p))),center=box.getCenter(new THREE.Vector2());const inset=insets[f.properties.COUNTYCODE];const tr=coord=>{const [x,y]=project(coord);return inset?new THREE.Vector2((x-center.x)*inset[2]+inset[0],(y-center.y)*inset[2]+inset[1]):new THREE.Vector2(x,y)};const shapes=polygons.map(poly=>{const outer=poly[0].map(tr),shape=new THREE.Shape(outer);for(const ring of poly.slice(1))shape.holes.push(new THREE.Path(ring.map(tr)));return shape});const display=inset?new THREE.Vector2(inset[0],inset[1]):center;return {shapes,center:display}}
function addLabel(code,name,x,y,z){const el=document.createElement('span');el.className='map-label';el.textContent=name;el.style.pointerEvents='auto';el.style.cursor='pointer';el.addEventListener('click',()=>select(code));el.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')select(code)});const label=new CSS2DObject(el);label.position.set(x,y,z);scene.add(label);labels.push({code,label});return label}
function makeGeoScene(){const byCode=new Map(features.map(f=>[f.properties.COUNTYCODE,f]));for(const c of data.counties){const f=byCode.get(c.code);if(!f)continue;const {shapes,center}=countyShapes(f),record={code:c.code,center,meshes:[]};for(const shape of shapes){const g=new THREE.ExtrudeGeometry(shape,{depth:STYLE==='editorial'?.85:.32,bevelEnabled:false,curveSegments:2});const mat=STYLE==='editorial'?new THREE.MeshStandardMaterial({color:'#aebcab',roughness:.92,metalness:0}):new THREE.MeshStandardMaterial({color:'#162b3e',roughness:.7,metalness:.18,emissive:'#06192d',emissiveIntensity:.35});const mesh=new THREE.Mesh(g,mat);mesh.userData.code=c.code;mesh.castShadow=STYLE==='editorial';mesh.receiveShadow=true;scene.add(mesh);record.meshes.push(mesh);hitTargets.push(mesh)}if(STYLE==='broadcast'){const mat=new THREE.MeshStandardMaterial({color:color(c.candidates.find(x=>x.elected)?.party),emissive:color(c.candidates.find(x=>x.elected)?.party),emissiveIntensity:.65,transparent:true,opacity:.93,metalness:.35,roughness:.25});const column=new THREE.Mesh(new THREE.CylinderGeometry(1.55,2.3,1,10),mat);column.rotation.x=Math.PI/2;column.position.set(center.x,center.y,.8);column.userData.code=c.code;scene.add(column);record.column=column;hitTargets.push(column)}if(insets[c.code]){const ring=new THREE.Mesh(new THREE.RingGeometry(7.3,7.55,48),new THREE.MeshBasicMaterial({color:STYLE==='editorial'?'#849984':'#3e7d99',side:THREE.DoubleSide,transparent:true,opacity:.6}));ring.position.set(center.x,center.y,-.24);scene.add(ring);const label=addLabel(c.code,c.name,center.x,center.y-9,2);record.label=label;const picker=new THREE.Mesh(new THREE.CircleGeometry(7.5,24),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide}));picker.position.set(center.x,center.y,2);picker.userData.code=c.code;scene.add(picker);hitTargets.push(picker)}objects.set(c.code,record)}if(STYLE==='editorial'){const ground=new THREE.Mesh(new THREE.PlaneGeometry(170,160),new THREE.ShadowMaterial({color:'#5b6955',opacity:.2}));ground.position.z=-1;ground.receiveShadow=true;scene.add(ground)}}
const cartogram=[['09007','10017','63000','65000'],['09020','68000','10018','10004'],['10016','10005','66000','10002'],['10007','10008','10009','10015'],['10020','10010','67000','64000'],['10013','10014']];
function makeBlockScene(){const byCode=new Map(data.counties.map(c=>[c.code,c]));for(let row=0;row<cartogram.length;row++)for(let col=0;col<cartogram[row].length;col++){const code=cartogram[row][col],c=byCode.get(code),x=(col-1.5)*11.7+(row%2)*2.4,y=(2.5-row)*10.3,mat=new THREE.MeshStandardMaterial({color:color(c.candidates.find(x=>x.elected).party),roughness:.76,metalness:.02});const base=new THREE.Mesh(new THREE.CylinderGeometry(4.55,4.55,.8,6),new THREE.MeshStandardMaterial({color:'#b9d3c7',roughness:.85}));base.rotation.x=Math.PI/2;base.position.set(x,y,.1);base.userData.code=code;base.castShadow=true;base.receiveShadow=true;scene.add(base);hitTargets.push(base);const record={code,center:new THREE.Vector2(x,y),meshes:[base],blocks:[],material:mat};for(let j=0;j<8;j++){const block=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,1.05,6),mat);block.rotation.x=Math.PI/2;block.position.set(x,y,1+j*1.12);block.userData.code=code;block.castShadow=true;block.receiveShadow=true;block.visible=false;scene.add(block);record.blocks.push(block);hitTargets.push(block)}record.label=addLabel(code,c.name,x,y,11);objects.set(code,record)}const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:'#dcece5',roughness:1}));ground.position.z=-.7;ground.receiveShadow=true;scene.add(ground)}
function makeScene(){const holder=$('scene'),width=holder.clientWidth,height=holder.clientHeight;scene=new THREE.Scene();scene.background=new THREE.Color(STYLE==='broadcast'?'#081321':STYLE==='editorial'?'#e4e5d7':'#dcece5');renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(width,height);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=STYLE!=='broadcast';renderer.shadowMap.type=THREE.PCFSoftShadowMap;holder.appendChild(renderer.domElement);labelRenderer=new CSS2DRenderer();labelRenderer.setSize(width,height);labelRenderer.domElement.style.position='absolute';labelRenderer.domElement.style.inset='0';labelRenderer.domElement.style.pointerEvents='none';holder.appendChild(labelRenderer.domElement);if(STYLE==='blocks'){camera=new THREE.OrthographicCamera(-50,50,35,-35,.1,500);camera.position.set(73,-76,125);camera.lookAt(0,0,0)}else{camera=new THREE.PerspectiveCamera(STYLE==='broadcast'?43:40,width/height,.1,500);camera.position.set(STYLE==='broadcast'?31:13,STYLE==='broadcast'?-67:-35,STYLE==='broadcast'?124:155);camera.lookAt(-8,4,0)}controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.075;controls.minDistance=55;controls.maxDistance=250;controls.minZoom=.8;controls.maxZoom=2.6;controls.target.set(STYLE==='blocks'?0:-8,STYLE==='blocks'?0:4,0);controls.maxPolarAngle=Math.PI*.72;controls.update();scene.add(new THREE.AmbientLight('#ffffff',STYLE==='broadcast'?1.3:1.25));const sun=new THREE.DirectionalLight(STYLE==='broadcast'?'#80cfff':'#fff6dc',STYLE==='broadcast'?2.2:1.8);sun.position.set(-30,43,85);sun.castShadow=STYLE!=='broadcast';sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-95;sun.shadow.camera.right=95;sun.shadow.camera.top=95;sun.shadow.camera.bottom=-95;sun.shadow.camera.near=1;sun.shadow.camera.far=210;sun.shadow.bias=-.0003;scene.add(sun);if(STYLE==='blocks')makeBlockScene();else makeGeoScene();if(STYLE==='broadcast'){composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));bloom=new UnrealBloomPass(new THREE.Vector2(width,height),.62,.22,.78);composer.addPass(bloom);composer.addPass(new OutputPass())}const resize=()=>{const w=holder.clientWidth,h=holder.clientHeight;renderer.setSize(w,h);labelRenderer.setSize(w,h);if(camera.isPerspectiveCamera)camera.aspect=w/h;else{const half=35;camera.left=-half*w/h;camera.right=half*w/h;camera.top=half;camera.bottom=-half}camera.updateProjectionMatrix();if(composer)composer.setSize(w,h)};new ResizeObserver(resize).observe(holder);resize();bindPicking()}
function bindPicking(){const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();const pick=e=>{const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(mouse,camera);return ray.intersectObjects(hitTargets,false)[0]?.object.userData.code};let down;renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<7){const code=pick(e);if(code)select(code)}});renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')return;const code=pick(e);renderer.domElement.style.cursor=code?'pointer':'grab';if(code&&code!==selectedCode)select(code)})}
function createChrome(){const legend=$('legend');for(const p of partyOrder.concat('時代力量')){const item=document.createElement('span');item.innerHTML='<i class="swatch"></i><span></span>';item.style.setProperty('--party',color(p));item.lastChild.textContent=partyShort[p]||p;legend.appendChild(item)}const grid=$('county-grid');for(const c of data.counties){const row=document.createElement('button');row.type='button';row.className='county-row';row.dataset.code=c.code;row.innerHTML='<strong></strong><span></span><em></em>';row.children[0].textContent=c.name;row.addEventListener('click',()=>{select(c.code);document.querySelector('.panel').scrollIntoView({behavior:reduced?'instant':'smooth',block:'nearest'})});grid.appendChild(row)}}
function select(code){if(!data.counties.some(c=>c.code===code))return;selectedCode=code;document.querySelectorAll('.county-row').forEach(row=>{row.classList.toggle('active',row.dataset.code===code);row.setAttribute('aria-pressed',row.dataset.code===code)});labels.forEach(x=>x.label.element.classList.toggle('selected',x.code===code));drawUI(true)}
function candidateElements(c){const host=$('candidates');host.replaceChildren();c.candidates.forEach((candidate,i)=>{const row=document.createElement('div');row.className='candidate';const avatar=document.createElement('span');avatar.className='avatar';avatar.style.setProperty('--party',color(candidate.party));if(candidate.photo){const img=document.createElement('img');img.src=new URL(candidate.photo,new URL('../../data/mayor-2022.json',location.href));img.alt=candidate.name;img.onerror=()=>{img.remove();avatar.textContent=candidate.name[0]};avatar.appendChild(img)}else avatar.textContent=candidate.name[0];const identity=document.createElement('div');identity.innerHTML='<div class="candidate-name"></div><div class="candidate-party"><i class="swatch"></i><span></span></div>';identity.querySelector('.candidate-name').textContent=`${candidate.no} 號　${candidate.name}`;identity.querySelector('.candidate-party').style.setProperty('--party',color(candidate.party));identity.querySelector('.candidate-party span').textContent=candidate.party;const votes=document.createElement('div');votes.className='candidate-votes';votes.innerHTML='<span></span><small></small>';const bar=document.createElement('div');bar.className='vote-bar';bar.innerHTML='<span></span>';bar.firstChild.style.setProperty('--party',color(candidate.party));row.append(avatar,identity,votes,bar);host.appendChild(row)})}
function drawUI(force=false){if(!data||!latest.length)return;const snap=window._snapshot||snapshot(progress),s=latest[data.counties.findIndex(c=>c.code===selectedCode)],c=data.counties.find(x=>x.code===selectedCode);$('overall').textContent=snap.overall.toFixed(1)+'%';$('decided').textContent=`已開出 ${snap.decided} / 22 席`;const bar=$('seatbar'),labs=$('seat-labels');bar.replaceChildren();labs.replaceChildren();for(const party of partyOrder){const segment=document.createElement('span');segment.style.width=(snap.seats[party]||0)/22*100+'%';segment.style.background=color(party);bar.appendChild(segment);const item=document.createElement('span');item.innerHTML='<i class="swatch"></i><span></span>';item.style.setProperty('--party',color(party));item.lastChild.textContent=`${partyShort[party]} ${snap.seats[party]||0}`;labs.appendChild(item)}if(force||$('county-name').dataset.code!==selectedCode){$('county-name').dataset.code=selectedCode;$('county-name').textContent=c.name;$('county-type').textContent=c.type==='municipality'?'直轄市':c.type==='county'?'縣':'市';candidateElements(c)}$('county-progress').textContent=(s.p*100).toFixed(1)+'%';$('turnout').textContent=c.turnout.toFixed(2)+'%';[...$('candidates').children].forEach((row,i)=>{const candidate=c.candidates[i],vote=s.votes[i],share=s.total?vote/s.total*100:0,shown=s.p===1?candidate.pct.toFixed(2):share.toFixed(1);row.querySelector('.candidate-votes span').textContent=fmt.format(vote);row.querySelector('.candidate-votes small').textContent=shown+'% 得票率';row.querySelector('.vote-bar span').style.width=share+'%';const name=row.querySelector('.candidate-name'),badge=name.querySelector('.winner-badge');if(s.p===1&&candidate.elected&&!badge){const el=document.createElement('b');el.className='winner-badge';el.textContent='當選';el.style.setProperty('--party',color(candidate.party));name.appendChild(el)}else if(s.p<1&&badge)badge.remove()});[...$('county-grid').children].forEach((row,i)=>{const st=latest[i],lead=data.counties[i].candidates[st.leader];row.children[1].textContent=st.total?lead.name:'待開票';row.children[1].style.color=st.total?color(lead.party):'';row.children[2].textContent=st.total?(st.p===1?lead.pct.toFixed(2):(st.votes[st.leader]/st.total*100).toFixed(1))+'%':'—'});$('timeline').value=Math.round(progress*1000);$('time-readout').textContent=`00:${String(Math.round(progress*30)).padStart(2,'0')}`;$('play').textContent=playing?'暫停':progress>=1?'重播':'播放';$('speed').textContent=speed+'×';$('speed').setAttribute('aria-label',`播放速度 ${speed} 倍`)}
function updateScene(){const max=Math.max(...data.counties.map(c=>c.valid));for(let i=0;i<data.counties.length;i++){const c=data.counties[i],s=latest[i],o=objects.get(c.code);if(!o)continue;const lead=c.candidates[s.leader],hex=color(lead.party),chosen=c.code===selectedCode;if(STYLE==='broadcast'){const h=.25+13*Math.sqrt(s.total/max);o.column.scale.set(chosen?1.28:1,h,chosen?1.28:1);o.column.position.z=.45+h/2;o.column.material.color.set(hex);o.column.material.emissive.set(hex);o.column.material.emissiveIntensity=chosen?.95:.65;for(const mesh of o.meshes){mesh.material.color.set(chosen?'#2b5364':'#152a3d');mesh.material.emissive.set(chosen?hex:'#06192d');mesh.material.emissiveIntensity=chosen?.24:.35}}else if(STYLE==='editorial'){for(const mesh of o.meshes){mesh.position.z=s.p*.7;mesh.material.color.set(hex);mesh.material.emissive.set(chosen?hex:'#000000');mesh.material.emissiveIntensity=chosen?.14:0}}else{o.material.color.set(hex);o.material.emissive.set(chosen?hex:'#000000');o.material.emissiveIntensity=chosen?.16:0;const count=s.total?Math.max(1,Math.ceil(Math.sqrt(s.total/max)*8)):0;o.blocks.forEach((block,j)=>{block.visible=j<count;block.scale.set(chosen?1.07:1,1,chosen?1.07:1)})}}}
function update(t,force=false){progress=Math.max(0,Math.min(1,t));window._snapshot=snapshot(progress);latest=window._snapshot.states;updateScene();drawUI(force)}
let accumulated=0;
function frame(now){const dt=Math.min(now-lastFrame,100);lastFrame=now;if(playing&&progress<1){accumulated+=dt;if(now-lastUI>80){update(progress+accumulated/30000*speed);accumulated=0;lastUI=now;if(progress>=1){playing=false;drawUI()}}}controls.update();if(bloom)bloom.strength=reduced?.62:.62+.05*Math.sin(now*.003);if(composer)composer.render();else renderer.render(scene,camera);labelRenderer.render(scene,camera);requestAnimationFrame(frame)}
async function init(){try{const [d,topo]=await Promise.all([fetch('../../data/mayor-2022.json').then(r=>{if(!r.ok)throw Error('選舉資料載入失敗');return r.json()}),fetch('../../data/taiwan-atlas-counties-10t.json').then(r=>{if(!r.ok)throw Error('地圖資料載入失敗');return r.json()})]);data=d;features=feature(topo,topo.objects.counties).features;for(const c of data.counties){c._curve=curveFor(c);c._winner=c.candidates.findIndex(x=>x.elected);c._runner=c.candidates.map((x,i)=>i).filter(i=>i!==c._winner).sort((a,b)=>c.candidates[b].votes-c.candidates[a].votes)[0];c._close=(c.candidates[c._winner].votes-c.candidates[c._runner].votes)/c.valid<.12}createChrome();makeScene();update(0,true);$('play').addEventListener('click',()=>{if(progress>=1)update(0,true);playing=!playing;drawUI()});$('speed').addEventListener('click',()=>{speed=speed===1?4:1;drawUI()});$('timeline').addEventListener('input',e=>{update(Number(e.target.value)/1000,true);if(progress>=1)playing=false;drawUI()});window.__voteDraft={setProgress:t=>{playing=false;update(t,true)},getSnapshot:()=>({progress,selectedCode,...window._snapshot}),select};requestAnimationFrame(frame)}catch(err){$('scene').innerHTML=`<div class="error">資料載入失敗，請重新整理頁面。<br>${err.message}</div>`;console.error(err)}}
init();
